<!doctype html>
<html lang="ko">
  <body style="margin:0;background:#ffffff;color:#222222;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo','Noto Sans KR',sans-serif;">
    <div style="box-sizing:border-box;max-width:480px;margin:0 auto;padding:44px 24px;">
      <p style="margin:0 0 34px;font-size:22px;font-weight:700;letter-spacing:-0.5px;">teamLedger</p>
      <h1 style="margin:0 0 12px;font-size:20px;line-height:1.45;letter-spacing:-0.4px;">장부에 로그인하세요.</h1>
      <p style="margin:0 0 26px;color:#626262;font-size:14px;line-height:1.75;">아래 버튼을 누르면 웹 장부가 열립니다.</p>
      <p style="margin:0 0 30px;">
        <a href="{{ .ConfirmationURL }}" style="display:inline-block;box-sizing:border-box;min-width:148px;padding:13px 18px;border-radius:6px;background:#222222;color:#ffffff;text-decoration:none;font-size:14px;font-weight:600;text-align:center;">장부 열기</a>
      </p>
      <div style="border-top:1px solid #e5e5e5;padding-top:24px;">
        <p style="margin:0 0 8px;color:#626262;font-size:13px;line-height:1.65;">iPhone 앱에서는 아래 인증 코드를 입력하세요.</p>
        <p style="margin:0;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:25px;font-weight:600;letter-spacing:3px;">{{ .Token }}</p>
      </div>
      <p style="margin:34px 0 0;color:#8a8a8a;font-size:12px;line-height:1.7;">로그인을 요청하지 않았다면 이 메일을 무시해 주세요. 인증 코드는 다른 사람에게 알려주지 마세요.</p>
    </div>
  </body>
</html>
